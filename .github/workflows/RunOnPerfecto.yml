name: Scenario 1
on: [workflow_dispatch]
env:
  security_token: ${{ secrets.Security_Token }}
jobs:
  testOnPerfecto:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Run test
        run: mvn clean install test -Dreportium-job-name=${{ github.job }} -Dreportium-job-number=${{ github.run_number }} -Dperfecto.capabilities.securityToken=eyJhbGciOiJIUzI1NiIsInR5cCIgOiAiSldUIiwia2lkIiA6ICIyODhhNDIyNS1jOTE1LTQwZDctOTc2YS04MDhiMWE3YTFmODYifQ..2zilOo3_wwazttNPWcw0mfvq63KdDjoQ5uPgVEfLVUc
      - name: Retrieve Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artifacts
          path: allure-results
