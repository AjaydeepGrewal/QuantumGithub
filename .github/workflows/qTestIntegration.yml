name: CI & QTest Automation Reporting

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  run-tests-and-report:
    runs-on: ubuntu-latest
    
    # --- Environment Variables ---
    env:
      # General Setup Variables
      JAVA_VERSION: '17'
      
      # qTest Reporting Variables (Use secrets for the token)
      QTEST_TOKEN: ${{ secrets.QTEST_TOKEN }} 
      QTEST_PROJECT_ID: 41456
      QTEST_PARENT_CYCLE_ID: 5644943
      
      # Define paths and URLs
      XML_REPORT_DIR: 'Quantum-Starter-Kit/target/surefire-reports/junitreports/'
      QTEST_RUN_URL: 'https://cambridgeasmt.qtestnet.com/api/v3/projects/41456/test-runs/automation'

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      
      # 1. GENERATE JUNIT RESULTS FILE
      - name: 🔨 Run Maven Tests and Generate JUnit Report
        # This step executes your tests and creates the XML file in the path defined by XML_REPORT_DIR
        run: |
          echo "Starting test execution to generate JUnit reports..."
          cd Quantum-Starter-Kit
          mvn clean test
          echo "Test execution complete. Reports should be available in ${GITHUB_WORKSPACE}/${XML_REPORT_DIR}"

      # 2. PARSE, CREATE CYCLE, AND SUBMIT
      - name: ⚙️ Parse XML, Create Cycle, & Submit Results to qTest
        id: parse_and_submit
        # Pass GitHub built-in and custom environment variables to the script
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          
        run: |
          # The entire Python script logic is embedded here to handle all reporting steps.
          python << EOF
          import xml.etree.ElementTree as ET
          import json
          import os
          import sys
          import glob
          import subprocess
          from datetime import datetime, timezone

          # --- CONFIGURATION (Reading from GitHub Actions ENV) ---
          XML_SEARCH_PATH = os.environ['XML_REPORT_DIR'] + 'TEST-*.xml'
          QTEST_RUN_URL = os.environ['QTEST_RUN_URL']
          QTEST_PROJECT_ID = os.environ['QTEST_PROJECT_ID']
          QTEST_PARENT_CYCLE_ID = os.environ['QTEST_PARENT_CYCLE_ID']
          QTEST_TOKEN = os.environ['QTEST_TOKEN']
          
          # Use GitHub Run Number for unique cycle name
          RUN_NUMBER = os.environ['GITHUB_RUN_NUMBER']
          CYCLE_NAME = f"GitHub Run #{RUN_NUMBER}" 
          
          # API endpoint for creating a new Test Cycle
          QTEST_CYCLE_URL = f"https://cambridgeasmt.qtestnet.com/api/v3/projects/{QTEST_PROJECT_ID}/test-cycles?parentId={QTEST_PARENT_CYCLE_ID}&parentType=test-cycle"

          # Static values and mappings
          MODULE_NAMES = ["ProductionV5.0", "API Tests"]
          STATUS_MAP = {
              "Passed": "PASSED", "Failed": "FAILED", "Skipped": "SKIPPED", "Error": "FAILED" 
          }
          
          # --- HELPER FUNCTION: Execute Curl Request (for brevity, keeping the full function here) ---
          def execute_curl(url, method, payload=None):
              print(f"\n[CURL] Executing {method} request to {url}")
              curl_command = [
                  'curl', '-s', '-X', method, url,
                  '-H', f"Authorization: Bearer {QTEST_TOKEN}",
                  '-H', 'Content-Type: application/json'
              ]
              if payload:
                  PAYLOAD_FILE = 'temp_payload.json'
                  with open(PAYLOAD_FILE, 'w') as f:
                      json.dump(payload, f)
                  curl_command.extend(['-d', f'@{PAYLOAD_FILE}'])

              result = subprocess.run(curl_command, capture_output=True, text=True, check=False)
              
              if result.returncode != 0:
                  print(f"::error::Curl failed with exit code {result.returncode}. Stderr: {result.stderr}")
                  return None
              
              try:
                  return json.loads(result.stdout)
              except json.JSONDecodeError:
                  print(f"::warning::API response was not valid JSON. Raw Response: {result.stdout}")
                  return {"error": result.stdout}

          # --- 1. Locate and Parse XML ---
          xml_files = glob.glob(XML_SEARCH_PATH)
          
          if not xml_files:
              print(f"::warning::No XML reports found at {XML_SEARCH_PATH}. Skipping qTest submission.")
              sys.exit(0)

          XML_FILE_PATH = xml_files[0]
          try:
              tree = ET.parse(XML_FILE_PATH)
              root = tree.getroot()
          except Exception as e:
              print(f"::error::Error parsing XML: {e}")
              sys.exit(1)

          # --- 2. Create New Test Cycle ---
          cycle_payload = {"name": CYCLE_NAME}
          print(f"Attempting to create new Test Cycle: {CYCLE_NAME}")
          
          cycle_response = execute_curl(QTEST_CYCLE_URL, "POST", cycle_payload)
          
          if cycle_response and 'id' in cycle_response:
              NEW_CYCLE_ID = cycle_response['id']
              print(f"✅ Successfully created new Test Cycle ID: {NEW_CYCLE_ID}")
          else:
              print(f"::error::Failed to create new Test Cycle. Cannot proceed. Response: {json.dumps(cycle_response)}")
              sys.exit(1)

          # --- 3. Extract Test Results & Build Payload ---
          results = []
          for testcase in root.findall('testcase'):
              test_name = testcase.get('name')
              status = 'Passed' 
              if testcase.find('failure') is not None: status = 'Failed'
              elif testcase.find('error') is not None: status = 'Error'
              elif testcase.find('skipped') is not None: status = 'Skipped'
              results.append({"name": test_name, "status": status})
          
          current_time_utc = datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z')
          test_logs_list = []
          
          for result in results:
              test_logs_list.append({
                  "name": result['name'],
                  "automation_content": result['name'], 
                  "module_names": MODULE_NAMES,
                  "status": STATUS_MAP.get(result['status'], "UNEXECUTED"),
                  "exe_start_date": current_time_utc,
                  "exe_end_date": current_time_utc, 
                  "test_step_logs": [] 
              })

          final_payload = {
              "test_cycle": str(NEW_CYCLE_ID), 
              "test_logs": test_logs_list
          }
          
          # --- 4. Submit Test Runs ---
          print(f"\nAttempting to submit Test Runs to new Cycle ID: {NEW_CYCLE_ID}")
          run_response = execute_curl(QTEST_RUN_URL, "POST", final_payload)

          if run_response and 'successful' in run_response.get('result', {}).get('status', '').lower():
             print("✅ qTest Test Run submission successful.")
          else:
             print(f"❌ qTest Test Run submission failed. Response: {json.dumps(run_response)}")
          
          EOF
        shell: bash
