name: CI & QTest Automation Reporting

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  run-tests-and-report:
    runs-on: ubuntu-latest
    
    env:
      JAVA_VERSION: '17'
      QTEST_TOKEN: ${{ secrets.QTEST_TOKEN }} 
      QTEST_PROJECT_ID: 41456
      QTEST_CYCLE_ID: 'CL-178'
      SECURITY_TOKEN: ${{ secrets.SECURITY_TOKEN }}
      XML_REPORT_DIR: ${{ github.workspace }}/target/surefire-reports/junitreports
      QTEST_BASE_URL: 'https://cambridgeasmt.qtestnet.com/api/v3'

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK ${{ env.JAVA_VERSION }} with Maven Cache
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      
      # 1. GENERATE JUNIT RESULTS FILE
      - name: 🔨 Run Maven Tests
        continue-on-error: true
        run: |
          mvn clean install test \
            -Dreportium-job-name=${{ github.job }} \
            -Dreportium-job-number=${{ github.run_number }} \
            -Dperfecto.capabilities.securityToken=${{ secrets.SECURITY_TOKEN }}

      # 2. PARSE XML, CALCULATE DATES & SUBMIT
      - name: ⚙️ Parse XML & Submit Results
        id: parse_and_submit
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          
        run: |
          python << EOF
          import xml.etree.ElementTree as ET
          import json
          import os
          import sys
          import glob
          import urllib.request
          import urllib.error
          # ✅ Added timedelta for date math
          from datetime import datetime, timezone, timedelta

          # --- CONFIGURATION ---
          XML_DIR = os.environ.get('XML_REPORT_DIR', '')
          XML_SEARCH_PATH = os.path.join(XML_DIR, 'TEST-*.xml')
          
          QTEST_BASE_URL = os.environ['QTEST_BASE_URL']
          QTEST_PROJECT_ID = os.environ['QTEST_PROJECT_ID']
          QTEST_TOKEN = os.environ['QTEST_TOKEN']
          TARGET_CYCLE_ID = os.environ['QTEST_CYCLE_ID']

          MODULE_NAMES = ["ProductionV5.0", "API Tests"]
          STATUS_MAP = {
              "Passed": "Passed", 
              "Failed": "Failed", 
              "Skipped": "Skipped", 
              "Error": "Failed" 
          }

          # --- HELPER: Native HTTP Request ---
          def send_request(endpoint, method, payload=None):
              url = f"{QTEST_BASE_URL}{endpoint}"
              print(f"\n[API] {method} {url}")
              
              headers = {
                  'Content-Type': 'application/json',
                  'Authorization': f"Bearer {QTEST_TOKEN}"
              }
              
              data = json.dumps(payload).encode('utf-8') if payload else None
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              
              try:
                  with urllib.request.urlopen(req) as response:
                      if response.status >= 200 and response.status < 300:
                          return json.loads(response.read().decode('utf-8'))
                      else:
                          print(f"::error::HTTP Error {response.status}")
                          return None
              except urllib.error.HTTPError as e:
                  error_body = e.read().decode()
                  print(f"::error::API Request Failed: {e.code} - {error_body}")
                  sys.exit(1)
              except Exception as e:
                  print(f"::error::Unexpected error: {e}")
                  sys.exit(1)

          # --- 1. Locate and Parse XML Files ---
          xml_files = glob.glob(XML_SEARCH_PATH)
          
          if not xml_files:
              print(f"::warning::No XML reports found at {XML_SEARCH_PATH}. Skipping qTest submission.")
              sys.exit(0)

          all_test_logs = []
          
          # Use current time as the baseline "End Time"
          now_utc = datetime.now(timezone.utc)

          print(f"Found {len(xml_files)} XML files. Parsing...")

          for xml_file in xml_files:
              try:
                  tree = ET.parse(xml_file)
                  root = tree.getroot()
                  
                  for testcase in root.findall('testcase'):
                      test_name = testcase.get('name')
                      
                      # ✅ 1. Get Duration from XML (default to 0 if missing)
                      time_attr = testcase.get('time', '0')
                      try:
                          duration_seconds = float(time_attr)
                      except ValueError:
                          duration_seconds = 0.0

                      # ✅ 2. Calculate Start Time based on Duration
                      end_dt = now_utc
                      start_dt = end_dt - timedelta(seconds=duration_seconds)

                      # ✅ 3. Format strict ISO 8601 with 'Z'
                      fmt = '%Y-%m-%dT%H:%M:%SZ'
                      exe_end_str = end_dt.strftime(fmt)
                      exe_start_str = start_dt.strftime(fmt)

                      # Determine Status
                      status_key = 'Passed'
                      if testcase.find('failure') is not None: status_key = 'Failed'
                      elif testcase.find('error') is not None: status_key = 'Error'
                      elif testcase.find('skipped') is not None: status_key = 'Skipped'
                      
                      all_test_logs.append({
                          "name": test_name,
                          "automation_content": test_name, 
                          "module_names": MODULE_NAMES,
                          "status": STATUS_MAP.get(status_key, "UNEXECUTED"),
                          "exe_start_date": exe_start_str, # 🟢 Calculated Start
                          "exe_end_date": exe_end_str,     # 🟢 Current End
                          "test_step_logs": [] 
                      })
              except Exception as e:
                  print(f"::error::Error parsing {xml_file}: {e}")

          if not all_test_logs:
              print("No test cases extracted. Exiting.")
              sys.exit(0)

          # --- 2. Prepare Payload ---
          final_payload = {
              "test_cycle": TARGET_CYCLE_ID, 
              "test_logs": all_test_logs
          }

          print(f"Submitting {len(all_test_logs)} results to Cycle: {TARGET_CYCLE_ID}")
          
          # Debug Print
          print("\n🔻🔻🔻 FULL PAYLOAD PREVIEW 🔻🔻🔻")
          print(json.dumps(final_payload, indent=2))
          print("🔺🔺🔺 END PAYLOAD PREVIEW 🔺🔺🔺\n")

          # --- 3. Submit ---
          logs_endpoint = f"/projects/{QTEST_PROJECT_ID}/auto-test-logs?type=automation"
          run_response = send_request(logs_endpoint, "POST", final_payload)

          print(f"✅ Results successfully uploaded.")
          
          EOF
        shell: bash
